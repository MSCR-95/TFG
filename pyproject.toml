[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alglab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pebble>=5.2",
    "loguru>=0.7",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pandas>=3.0",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.0",
]

[project.optional-dependencies]
qubo = [
    "dwave-ocean-sdk>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.9",
    "mypy>=1.15",
    "pre-commit>=4.2",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
alglab = "alglab._cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/alglab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
addopts = "--basetemp=tmp"
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child\\.:DeprecationWarning:multiprocessing\\.popen_fork",
    "ignore:.*Input data has range zero\\..*:UserWarning:scipy\\.stats\\._axis_nan_policy",
    "ignore:invalid value encountered in divide:RuntimeWarning:scipy\\.stats\\._morestats",
    "ignore:invalid value encountered in scalar divide:RuntimeWarning:scipy\\.stats\\._wilcoxon",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "D",        # pydocstyle
]
ignore = [
    "E501",     # line length — handled by formatter
    "B008",     # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["alglab"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["alglab"]
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = true
# Relax for private helpers and test internals
[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
